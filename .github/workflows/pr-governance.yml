name: PR Governance

on:
  pull_request:
    types:
      - opened
      - edited
      - synchronize
      - reopened
      - converted_to_draft
      - ready_for_review
  pull_request_review:
    types:
      - submitted
      - edited
      - dismissed

permissions:
  checks: read
  contents: read
  pull-requests: read
  issues: read
  statuses: read

# Deliberately no workflow-level concurrency. Every governance-triggering event
# must produce a terminal result; cancelled required contexts are ambiguous.

jobs:
  body-validation:
    name: PR Governance / Body Validation
    runs-on: ubuntu-latest
    steps:
      - name: Validate PR body completeness
        uses: actions/github-script@v8
        with:
          script: |
            const { owner, repo } = context.repo;
            const pullNumber = context.payload.pull_request?.number;
            if (!pullNumber) {
              core.setFailed("Pull request event payload bulunamadı.");
              return;
            }
            const { data: pr } = await github.rest.pulls.get({ owner, repo, pull_number: pullNumber });
            if (pr.draft) {
              core.notice("Draft PR: body completeness ready_for_review olayında doğrulanacak.");
              return;
            }
            const body = pr.body || "";
            const requiredSections = [
              "Amaç",
              "Kapsam",
              "Kapsam dışı",
              "Acceptance criteria",
              "Test çıktısı",
              "KVKK/audit etkisi",
              "Rollback",
              "CI run referansı"
            ];
            const placeholders = new Set([
              "", "-", "--", "---", "n/a", "na", "none", "null", "todo", "tbd",
              "boş", "yok", "henüz yok", "sonra", "daha sonra", "placeholder", "fixes #"
            ]);

            function escapeRegex(value) {
              return value.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
            }

            function extractSection(title) {
              const others = requiredSections
                .filter((section) => section !== title)
                .map(escapeRegex)
                .join("|");
              const pattern = new RegExp(
                `(?:^|\\n)#{2,3}\\s*${escapeRegex(title)}\\s*\\n([\\s\\S]*?)(?=\\n#{2,3}\\s*(?:${others})\\s*\\n|$)`,
                "i"
              );
              return body.match(pattern)?.[1]?.trim() || "";
            }

            function clean(value) {
              return value
                .replace(/<!--[\s\S]*?-->/g, "")
                .replace(/```[\s\S]*?```/g, "")
                .replace(/[-*]\s*\[[ xX]\]\s*/g, "")
                .replace(/^[-*]\s*$/gm, "")
                .replace(/^[-*]\s*[^:\n]+:\s*$/gm, "")
                .trim();
            }

            function isWeak(value) {
              const normalized = clean(value).trim().toLowerCase();
              return !normalized || normalized.length < 20 || placeholders.has(normalized);
            }

            const failures = [];
            for (const section of requiredSections) {
              if (isWeak(extractSection(section))) failures.push(`Eksik/geçersiz bölüm: ${section}`);
            }

            const testOutput = clean(extractSection("Test çıktısı"));
            if (!/(pass|fail|success|completed|başarılı|başarısız|https:\/\/github\.com\/.*\/actions\/runs\/\d+|\brun\s*id\b|\b\d{6,}\b)/i.test(testOutput)) {
              failures.push("Test çıktısı bölümü gerçek PASS/FAIL veya CI run kanıtı içermiyor.");
            }

            const ciRef = clean(extractSection("CI run referansı"));
            if (!/(https:\/\/github\.com\/.*\/actions\/runs\/\d+|\brun\s*id\b|\b\d{6,}\b)/i.test(ciRef)) {
              failures.push("CI run referansı bölümü GitHub Actions URL, run id veya açık run referansı içermiyor.");
            }

            const kvkk = clean(extractSection("KVKK/audit etkisi"));
            if (!/(kvkk|audit|redaction|kişisel veri|pii|öğrenci|veli|parent|guardian|log|notification|payload|etki yok|etkisi yok)/i.test(kvkk)) {
              failures.push("KVKK/audit etkisi bölümü gerçek veri/audit/log değerlendirmesi içermiyor.");
            }

            const explicitDraftMarker =
              /^\s*(?:status|durum)\s*:\s*(?:draft|taslak|wip)\s*$/im.test(body) ||
              /^\s*\[(?:draft|taslak|wip)\]\s*/i.test(pr.title || "");
            if (explicitDraftMarker && pr.draft === false) {
              failures.push("PR açıkça Draft/Taslak/WIP olarak işaretlenmiş ancak GitHub draft metadata false. PR gerçek Draft olarak açılmalı.");
            }

            if (failures.length) core.setFailed(failures.join("\n"));

  issue-reference:
    name: PR Governance / Issue Reference
    runs-on: ubuntu-latest
    steps:
      - name: Validate issue reference
        uses: actions/github-script@v8
        with:
          script: |
            const { owner, repo } = context.repo;
            const pullNumber = context.payload.pull_request?.number;
            if (!pullNumber) {
              core.setFailed("Pull request event payload bulunamadı.");
              return;
            }
            const { data: pr } = await github.rest.pulls.get({ owner, repo, pull_number: pullNumber });
            if (pr.draft) {
              core.notice("Draft PR: issue reference ready_for_review olayında doğrulanacak.");
              return;
            }
            const text = `${pr.title || ""}\n${pr.body || ""}`;
            if (!/\b(fixes|fix|closes|close|resolves|resolve|refs|references)\s+#\d+\b/i.test(text)) {
              core.setFailed("PR title/body içinde geçerli issue referansı yok. Örnek: Fixes #123 veya Refs #123");
            }

  rollback-plan:
    name: PR Governance / Rollback Plan
    runs-on: ubuntu-latest
    steps:
      - name: Validate rollback plan
        uses: actions/github-script@v8
        with:
          script: |
            const { owner, repo } = context.repo;
            const pullNumber = context.payload.pull_request?.number;
            if (!pullNumber) {
              core.setFailed("Pull request event payload bulunamadı.");
              return;
            }
            const { data: pr } = await github.rest.pulls.get({ owner, repo, pull_number: pullNumber });
            if (pr.draft) {
              core.notice("Draft PR: rollback planı ready_for_review olayında doğrulanacak.");
              return;
            }
            const body = pr.body || "";
            const rollback = body.match(/(?:^|\n)#{2,3}\s*Rollback\s*\n([\s\S]*?)(?=\n#{2,3}\s|\s*$)/i)?.[1]?.trim() || "";
            const normalized = rollback.replace(/<!--[\s\S]*?-->/g, "").trim();
            const weak = /^(|[-_. ]+|n\/a|na|none|null|todo|tbd|boş|yok|sonra|daha sonra|placeholder)$/i;
            const hasRollbackSignal = /\b(revert|rollback|migration down|migrate:revert|restore|feature flag|disable|hotfix|previous release|backup|geri al|geri dönüş)\b/i.test(normalized);
            if (!normalized || normalized.length < 30 || weak.test(normalized) || !hasRollbackSignal) {
              core.setFailed("Rollback bölümü gerçek geri dönüş planı içermiyor. Revert/migration rollback/feature flag/restore/hotfix adımı yazılmalı.");
            }

  acceptance-criteria:
    name: PR Governance / Acceptance Criteria
    runs-on: ubuntu-latest
    steps:
      - name: Validate acceptance criteria
        uses: actions/github-script@v8
        with:
          script: |
            const { owner, repo } = context.repo;
            const pullNumber = context.payload.pull_request?.number;
            if (!pullNumber) {
              core.setFailed("Pull request event payload bulunamadı.");
              return;
            }
            const { data: pr } = await github.rest.pulls.get({ owner, repo, pull_number: pullNumber });
            if (pr.draft) {
              core.notice("Draft PR: acceptance criteria ready_for_review olayında doğrulanacak.");
              return;
            }
            const body = pr.body || "";
            const ac = body.match(/(?:^|\n)#{2,3}\s*Acceptance criteria\s*\n([\s\S]*?)(?=\n#{2,3}\s|\s*$)/i)?.[1]?.trim() || "";
            const allChecklistItems = ac.match(/^\s*[-*]\s*\[[ xX]\]\s+\S.*$/gim) || [];
            const measurableItems = allChecklistItems.filter((item) =>
              item.replace(/^\s*[-*]\s*\[[ xX]\]\s+/i, "").trim().length >= 10
            );
            const uncheckedItems = allChecklistItems.filter((item) =>
              /^\s*[-*]\s*\[\s\]\s+\S/i.test(item)
            );
            const weak = /^(|[-_. ]+|n\/a|na|none|null|todo|tbd|boş|yok|placeholder)$/i;
            const failures = [];

            function stripLine(line) {
              return line
                .replace(/^\s*[-*]\s*/, "")
                .replace(/\*\*/g, "")
                .replace(/`/g, "")
                .trim();
            }

            function hasBlockingToken(value) {
              return /\b(hold|not authorized|unauthorized|no-go|no go)\b/i.test(value);
            }

            function blockingDecisionLines(markdown) {
              const withoutComments = markdown.replace(/<!--[\s\S]*?-->/g, "");
              const findings = [];
              const sectionPattern = /(?:^|\n)#{2,3}\s*(karar|decision|son karar|durum|status)\s*\n([\s\S]*?)(?=\n#{1,3}\s|$)/gi;
              for (const match of withoutComments.matchAll(sectionPattern)) {
                const sectionBody = match[2].trim();
                if (hasBlockingToken(sectionBody)) {
                  findings.push(`${match[1]}: ${sectionBody.replace(/\s+/g, " ").slice(0, 180)}`);
                }
              }

              const withoutExamples = withoutComments.replace(/```[\s\S]*?```/g, "");
              for (const line of withoutExamples.split(/\r?\n/).map(stripLine).filter(Boolean)) {
                const match = /^((?:karar|decision|son karar|merge|ready\/merge|runtime|governance|authorization|status|durum)[^:\n]{0,80})\s*[:\-–—]\s*(.+)$/i.exec(line);
                if (match && hasBlockingToken(match[2])) findings.push(line);
              }
              return [...new Set(findings)];
            }

            if (!ac || weak.test(ac.trim()) || measurableItems.length < 1) {
              failures.push("Acceptance criteria bölümü checklist formatında ve ölçülebilir olmalı. Örnek: - [ ] Backend CI PASS");
            }
            if (!pr.draft && uncheckedItems.length > 0) {
              failures.push(`Ready PR içinde ${uncheckedItems.length} tamamlanmamış acceptance criteria maddesi var.`);
            }

            const blockingDecisions = blockingDecisionLines(body);
            if (!pr.draft && blockingDecisions.length > 0) {
              failures.push(`Ready PR body içinde merge/ready engelleyici karar var: ${blockingDecisions.join(" | ")}`);
            }

            if (failures.length) core.setFailed(failures.join("\n"));

  thread-resolution:
    name: PR Governance / Review Thread Resolution
    runs-on: ubuntu-latest
    steps:
      - name: Validate all review threads resolved
        uses: actions/github-script@v8
        with:
          script: |
            const { owner, repo } = context.repo;
            const pullNumber = context.payload.pull_request?.number;
            if (!pullNumber) {
              core.setFailed("Pull request event payload bulunamadı.");
              return;
            }
            const { data: pr } = await github.rest.pulls.get({ owner, repo, pull_number: pullNumber });
            if (pr.draft) {
              core.notice("Draft PR: thread resolution ready_for_review olayında doğrulanacak.");
              return;
            }
            // Review thread'leri GraphQL ile çek (REST listReviewThreads bu Octokit
            // sürümünde mevcut değil; GraphQL reviewThreads bağlantısı çalışır).
            const result = await github.graphql(
              `query($owner: String!, $repo: String!, $num: Int!) {
                 repository(owner: $owner, name: $repo) {
                   pullRequest(number: $num) {
                     reviewThreads(first: 50) {
                       nodes { id isResolved }
                     }
                   }
                 }
               }`,
              { owner, repo, num: pullNumber }
            );
            const threads = result?.repository?.pullRequest?.reviewThreads?.nodes || [];
            const openThreads = threads.filter((t) => t.isResolved !== true);
            if (openThreads.length > 0) {
              const ids = openThreads.map((t) => t.id).join(", ");
              core.setFailed(`PR'da ${openThreads.length} çözülmemiş review thread var (${ids}). Merge öncesi tüm thread'ler resolve edilmeli.`);
            }
