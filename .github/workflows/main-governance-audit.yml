name: Main Governance Audit

on:
  push:
    branches:
      - main

permissions:
  checks: read
  contents: read
  issues: write
  pull-requests: read
  statuses: read

jobs:
  audit:
    name: Main Governance Audit
    runs-on: ubuntu-latest
    steps:
      - name: Detect ungoverned main updates
        uses: actions/github-script@v8
        with:
          script: |
            const { owner, repo } = context.repo;
            const mergeSha = context.sha;
            const requiredChecks = [
              "Sprint 1 Quality Gate",
              "Backend CI",
              "DB Smoke",
              "Gate 1 CI",
              "Sensitive Pattern Scanner",
              "GitGuardian scan",
              "PR Governance / Body Validation",
              "PR Governance / Issue Reference",
              "PR Governance / Rollback Plan",
              "PR Governance / Acceptance Criteria"
            ];

            const violations = [];
            const associated = await github.rest.repos.listPullRequestsAssociatedWithCommit({
              owner,
              repo,
              commit_sha: mergeSha
            });

            const pr = associated.data.find((item) => item.merged_at && item.base?.ref === "main");
            if (!pr) {
              violations.push("main güncellemesiyle ilişkili merge edilmiş pull request bulunamadı; direct push veya korumasız ref update olasılığı var.");
            } else {
              const fullPr = (await github.rest.pulls.get({
                owner,
                repo,
                pull_number: pr.number
              })).data;
              const mergedAt = new Date(fullPr.merged_at);
              const atOrBeforeMerge = (value) => Boolean(value) && new Date(value) <= mergedAt;

              const reviews = await github.paginate(github.rest.pulls.listReviews, {
                owner,
                repo,
                pull_number: pr.number,
                per_page: 100
              });
              const mergeTimeReviews = reviews
                .filter((review) => atOrBeforeMerge(review.submitted_at))
                .sort((a, b) => (a.id || 0) - (b.id || 0));

              const latestReviewByUser = new Map();
              for (const review of mergeTimeReviews) {
                const login = review.user?.login;
                if (login) latestReviewByUser.set(login, review);
              }

              const validApprovals = [...latestReviewByUser.values()].filter((review) => {
                const login = review.user?.login || "";
                const isBot = review.user?.type === "Bot" || /\[bot\]$/i.test(login);
                return review.state === "APPROVED" &&
                  review.commit_id === fullPr.head.sha &&
                  login !== fullPr.user.login &&
                  !isBot;
              });

              // GitHub does not expose a reliable resolvedAt timestamp for review threads.
              // Exclude threads created after merge; pre-merge thread resolution is also
              let cursor = null;
              let unresolvedMergeTimeThreadCount = 0;
              do {
                const result = await github.graphql(
                  `query($owner: String!, $repo: String!, $number: Int!, $cursor: String) {
                    repository(owner: $owner, name: $repo) {
                      pullRequest(number: $number) {
                        reviewThreads(first: 100, after: $cursor) {
                          nodes {
                            isResolved
                            comments(first: 1) { nodes { createdAt } }
                          }
                          pageInfo { hasNextPage endCursor }
                        }
                      }
                    }
                  }`,
                  { owner, repo, number: pr.number, cursor }
                );

                const threads = result.repository.pullRequest.reviewThreads;
                unresolvedMergeTimeThreadCount += threads.nodes.filter((thread) => {
                  const createdAt = thread.comments.nodes[0]?.createdAt;
                  return atOrBeforeMerge(createdAt) && !thread.isResolved;
                }).length;
                cursor = threads.pageInfo.hasNextPage ? threads.pageInfo.endCursor : null;
              } while (cursor);

              if (unresolvedMergeTimeThreadCount > 0) {
                violations.push(`PR #${pr.number}, merge öncesinde oluşturulmuş ${unresolvedMergeTimeThreadCount} çözülmemiş review thread taşıyor.`);
              }

              // Fetch every historical check run. The Checks API defaults to latest;
              // filter=all is required so post-merge reruns cannot hide merge-time evidence.
              const checkRuns = await github.paginate(github.rest.checks.listForRef, {
                owner,
                repo,
                ref: fullPr.head.sha,
                per_page: 100,
                filter: "all"
              });
              const checkSuites = await github.paginate(github.rest.checks.listSuitesForRef, {
                owner,
                repo,
                ref: fullPr.head.sha,
                per_page: 100
              });
              const suiteCreatedAt = new Map(
                checkSuites.map((suite) => [suite.id, suite.created_at])
              );

              // Select the newest exact context whose check suite was CREATED at or before
              // merge. A queued check can have no started_at; suite.created_at is the stable
              // creation boundary. Never fall back to an older success when a newer pre-merge
              // run was pending, cancelled, failed or completed after merge.
              const latestCreatedByMerge = new Map();
              for (const check of checkRuns) {
                const createdAt = suiteCreatedAt.get(check.check_suite?.id);
                if (!atOrBeforeMerge(createdAt)) continue;
                const current = latestCreatedByMerge.get(check.name);
                const isNewerSuite = !current || new Date(createdAt) > new Date(current.createdAt);
                const isNewerRunInSuite = current && createdAt === current.createdAt && check.id > current.check.id;
                if (isNewerSuite || isNewerRunInSuite) {
                  latestCreatedByMerge.set(check.name, { check, createdAt });
                }
              }

              for (const name of requiredChecks) {
                const evidence = latestCreatedByMerge.get(name);
                const check = evidence?.check;
                if (!check) {
                  violations.push(`PR #${pr.number} merge anında oluşturulmuş required check kanıtı bulunamadı: ${name}.`);
                  continue;
                }
                if (check.status !== "completed") {
                  violations.push(`PR #${pr.number} merge anındaki ${name} terminal değildi: ${check.status}.`);
                  continue;
                }
                if (!atOrBeforeMerge(check.completed_at)) {
                  violations.push(`PR #${pr.number} merge anındaki ${name} merge sonrasına kadar tamamlanmadı.`);
                  continue;
                }
                if (check.conclusion !== "success") {
                  violations.push(`PR #${pr.number} merge anındaki ${name} SUCCESS değildi: ${check.conclusion || "unknown"}.`);
                }
              }

              await core.summary
                .addHeading("Merge-time governance snapshot")
                .addList([
                  `PR #${pr.number}`,
                  `Head: ${fullPr.head.sha}`,
                  `Merged at: ${fullPr.merged_at}`,
                  `Independent approvals before merge: ${validApprovals.length}`,
                  `Unresolved threads created before merge: ${unresolvedMergeTimeThreadCount}`,
                  `Required checks selected by check-suite created_at <= merged_at: ${requiredChecks.length}`
                ])
                .write();
            }

            if (!violations.length) {
              await core.summary
                .addHeading("Main Governance Audit")
                .addRaw("main güncellemesi merge-time governance şartlarını sağlıyor.")
                .write();
              return;
            }

            const shortSha = mergeSha.slice(0, 7);
            const title = `[Governance Incident] main update ${shortSha}`;
            const body = [
              "## Otomatik governance ihlali",
              "",
              `- Main commit: \`${mergeSha}\``,
              `- Workflow run: ${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`,
              "- Audit mode: merge-time snapshot",
              "",
              "## Bulgular",
              ...violations.map((violation) => `- ${violation}`),
              "",
              "## Operasyonel karar",
              "HOLD — ihlal incelenmeden yeni runtime merge yapılmamalıdır."
            ].join("\n");

            const existing = await github.rest.search.issuesAndPullRequests({
              q: `repo:${owner}/${repo} is:issue in:title "${title}"`
            });

            if (!existing.data.items.length) {
              await github.rest.issues.create({ owner, repo, title, body, assignees: [owner] });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: existing.data.items[0].number,
                body
              });
            }

            core.setFailed(violations.map((violation) => `- ${violation}`).join("\n"));
