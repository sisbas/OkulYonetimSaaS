name: Inspect Vercel build config

on:
  workflow_dispatch:
  push:
    branches:
      - ops/503-repair-preview-api-routing

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm ci
      - name: Build with Vercel CLI (no account required)
        env:
          CI: ''
          GITHUB_ACTIONS: ''
          VERCEL_TOKEN: ''
          VERCEL_ORG_ID: ''
          VERCEL_PROJECT_ID: ''
        run: npx --yes vercel@latest build --yes
      - name: Print API-related routes and function keys
        run: |
          node -e "const c=require('./.vercel/output/config.json'); console.log('FUNCTIONS:', JSON.stringify(Object.keys(c.functions||{}))); console.log('API ROUTES:'); for (const r of c.routes||[]) { const s=JSON.stringify(r); if (s.includes('api')) console.log(s.slice(0,600)); }"
