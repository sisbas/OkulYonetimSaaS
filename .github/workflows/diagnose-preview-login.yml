# #503 — read-only probe of the Vercel preview auth surface.
# Prints only HTTP statuses and scrubbed messages; no secrets or tokens.
name: Diagnose preview login

on:
  workflow_dispatch:
    inputs:
      preview_url:
        description: Full https preview URL (vercel.app)
        required: true
        type: string
      seed_mode:
        description: TEMP - set to 'seed' to seed the PR preview branch admin
        required: false
        default: ''
        type: string
      preview_branch:
        description: TEMP - git branch of the preview
        required: false
        default: ''
        type: string

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Probe preview auth endpoints
        env:
          PREVIEW_URL: ${{ inputs.preview_url }}
          VERCEL_BYPASS_SECRET: ${{ secrets.VERCEL_PROTECTION_BYPASS_SECRET }}
          ADMIN_EMAIL: preview-admin@okul.example
          ADMIN_PASSWORD: ${{ secrets.PREVIEW_ADMIN_PASSWORD }}
        run: node scripts/diagnose-preview-login.cjs

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: TEMP probe Vercel env
        if: inputs.seed_mode == 'probe'
        env:
          VERCEL_API_TOKEN: ${{ secrets.VERCEL_API_TOKEN }}
          VERCEL_TEAM_ID: ${{ secrets.VERCEL_TEAM_ID }}
        run: node scripts/probe-vercel-env.cjs

      - name: TEMP seed PR preview admin
        if: inputs.seed_mode == 'seed'
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          NEON_PROJECT_ID: ${{ vars.NEON_PROJECT_ID }}
          PREVIEW_BRANCH: ${{ inputs.preview_branch }}
          PREVIEW_RESET_CONFIRM: preview
          ADMIN_EMAIL: preview-admin@okul.example
          ADMIN_PASSWORD: ${{ secrets.PREVIEW_ADMIN_PASSWORD }}
        run: node scripts/seed-preview-branch-admin.cjs
