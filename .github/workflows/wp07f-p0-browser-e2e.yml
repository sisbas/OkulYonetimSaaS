name: WP-07F P0 Browser E2E

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
    branches:
      - main
      - develop
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wp07f-p0-browser-e2e-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  p0-browser-e2e:
    name: P0 browser E2E and artifact evidence
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ${{ github.run_id }}
          POSTGRES_DB: okul_yonetim_saas_p0_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d okul_yonetim_saas_p0_e2e"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      CI: true
      NODE_ENV: test
      PORT: 3000
      APP_BASE_URL: http://127.0.0.1:3000
      DATABASE_URL: postgres://postgres:${{ github.run_id }}@localhost:5432/okul_yonetim_saas_p0_e2e
      TEST_DATABASE_URL: postgres://postgres:${{ github.run_id }}@localhost:5432/okul_yonetim_saas_p0_e2e
      DATABASE_HOST: localhost
      DATABASE_PORT: 5432
      DATABASE_USER: postgres
      DATABASE_PASSWORD: ${{ github.run_id }}
      DATABASE_NAME: okul_yonetim_saas_p0_e2e
      TYPEORM_LOGGING: "false"
      JWT_ACCESS_SECRET: wp07f-${{ github.run_id }}-access
      JWT_REFRESH_SECRET: wp07f-${{ github.run_id }}-refresh
      SEED_TENANT_SLUG: system-seed
      SEED_TENANT_NAME: System Seed Tenant
      PUPPETEER_EXECUTABLE_STRATEGY: sparticuz
      E2E_SYNTHETIC_CREDENTIAL: wp07f-${{ github.run_id }}-runtime
      PULL_REQUEST_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Verify lockfile exists
        run: test -f package-lock.json

      - name: npm ci
        run: npm ci

      - name: Verify locked browser runner dependencies
        run: |
          node - <<'NODE'
          const puppeteer = require('puppeteer-core/package.json');
          const chromium = require('@sparticuz/chromium');
          console.log(`puppeteer-core locked version: ${puppeteer.version}`);
          (async () => {
            try {
              const executablePath = await chromium.executablePath();
              console.log(`@sparticuz/chromium executable: ${executablePath}`);
              console.log(`@sparticuz/chromium headless: ${chromium.headless}`);
            } catch (error) {
              console.warn(`@sparticuz/chromium executablePath warning: ${error.message}`);
            }
          })();
          NODE

      - name: Run migrations
        run: npm run db:migrate

      - name: Seed permissions
        run: npm run db:seed:permissions

      - name: Build Nest backend and /runtime assets
        run: npm run build

      - name: Start real Nest backend
        run: |
          set -euo pipefail
          mkdir -p artifacts/wp07f-p0-browser-e2e
          npx ts-node src/main.ts > artifacts/wp07f-p0-browser-e2e/backend.log 2>&1 &
          echo $! > artifacts/wp07f-p0-browser-e2e/backend.pid
          for i in {1..40}; do
            if ! kill -0 "$(cat artifacts/wp07f-p0-browser-e2e/backend.pid)" 2>/dev/null; then
              echo "Backend exited before /runtime became ready"
              tail -n 80 artifacts/wp07f-p0-browser-e2e/backend.log || true
              exit 1
            fi
            if curl -fsS http://127.0.0.1:3000/runtime/ >/dev/null; then
              echo "Runtime is ready"
              exit 0
            fi
            sleep 1
          done
          echo "Backend did not expose /runtime in time"
          tail -n 80 artifacts/wp07f-p0-browser-e2e/backend.log || true
          exit 1

      - name: Run P0 browser E2E matrix
        run: node scripts/qa-p0-browser-e2e.js

      - name: Upload P0 browser E2E artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wp07f-p0-browser-e2e-${{ github.event.pull_request.head.sha || github.sha }}
          path: artifacts/wp07f-p0-browser-e2e
          if-no-files-found: error
          retention-days: 14
