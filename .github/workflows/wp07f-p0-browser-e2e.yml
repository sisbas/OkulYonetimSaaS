name: WP-07F P0 Browser E2E

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
    branches:
      - main
      - develop
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wp07f-p0-browser-e2e-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  p0-browser-e2e:
    name: P0 browser E2E and artifact evidence
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ${{ github.run_id }}
          POSTGRES_DB: okul_yonetim_saas_p0_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d okul_yonetim_saas_p0_e2e"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      CI: true
      NODE_ENV: test
      PORT: 3000
      APP_BASE_URL: http://127.0.0.1:3000
      DATABASE_URL: postgres://postgres:${{ github.run_id }}@localhost:5432/okul_yonetim_saas_p0_e2e
      TEST_DATABASE_URL: postgres://postgres:${{ github.run_id }}@localhost:5432/okul_yonetim_saas_p0_e2e
      DATABASE_HOST: localhost
      DATABASE_PORT: 5432
      DATABASE_USER: postgres
      DATABASE_PASSWORD: ${{ github.run_id }}
      DATABASE_NAME: okul_yonetim_saas_p0_e2e
      TYPEORM_LOGGING: "false"
      JWT_ACCESS_SECRET: wp07f-${{ github.run_id }}-access-00000000000000000000000000000000
      JWT_REFRESH_SECRET: wp07f-${{ github.run_id }}-refresh-00000000000000000000000000000000
      SEED_TENANT_SLUG: system-seed
      SEED_TENANT_NAME: System Seed Tenant
      PUPPETEER_EXECUTABLE_STRATEGY: sparticuz
      E2E_SYNTHETIC_CREDENTIAL: wp07f-${{ github.run_id }}-runtime
      PULL_REQUEST_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Verify lockfile exists
        run: test -f package-lock.json

      - name: npm ci
        run: npm ci

      - name: Verify locked browser runner dependencies (mirrors runner args)
        run: |
          node --input-type=module - <<'NODE'
          import puppeteer from 'puppeteer-core';
          import puppeteerPackage from 'puppeteer-core/package.json' with { type: 'json' };
          import chromium from '@sparticuz/chromium';

          let browser;
          const executablePath = await chromium.executablePath();
          try {
            browser = await puppeteer.launch({
              executablePath,
              args: Array.from(new Set([...(chromium.args || []), '--no-sandbox', '--disable-setuid-sandbox', '--disable-dev-shm-usage', '--disable-gpu'])),
              headless: chromium.headless,
              timeout: 90000,
              protocolTimeout: 90000,
            });
            const page = await browser.newPage();
            await page.goto('about:blank');
            console.log(`puppeteer-core locked version: ${puppeteerPackage.version}`);
            console.log(`@sparticuz/chromium executable: ${executablePath}`);
            console.log(`@sparticuz/chromium headless: ${chromium.headless}`);
          } finally {
            if (browser) await browser.close();
          }
          NODE

      - name: Run migrations
        run: npm run db:migrate

      - name: Seed permissions
        run: npm run db:seed:permissions

      - name: Build Nest backend and /runtime assets
        run: npm run build

      - name: Acceptance evidence static guard (fail-closed)
        run: npm run test:e2e:guard

      # Kabul harness'ı gerçek Nest backend'ini (`src/main.ts`) kendisi başlatır
      # ve `/api/v1/health` yeşil olana kadar bekler; bu yüzden elle backend
      # başlatma adımı kaldırılmıştır (port tek sahipli olmalı).
      - name: Run acceptance E2E harness (fresh DB, real backend, real browser)
        run: npm run test:e2e

      - name: Upload P0 browser E2E artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wp07f-p0-browser-e2e-${{ github.event.pull_request.head.sha || github.sha }}
          path: artifacts/wp07f-p0-browser-e2e
          if-no-files-found: error
          retention-days: 14

      # Kanıt sözleşmesi (F1, #269): artefakt manifestoları exact head SHA'ya
      # bağlı olmalı ve PII/secret taraması bulgu=0 olmalıdır. Derin yapısal
      # doğrulama harness'ta (`verifyArtifactManifest`) ve guard spec'inde
      # yapılır; burada CI düzeyinde head bağı + redaksiyon + yasak verdict
      # etiketi denetlenir.
      - name: Verify acceptance artifacts are bound to the exact head SHA
        if: always()
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');

          const headSha = process.env.PULL_REQUEST_HEAD_SHA || '';
          const root = path.join('artifacts', 'wp07f-p0-browser-e2e');
          const manifests = [
            path.join(root, 'artifact-manifest.json'),
            path.join(root, 'journey', 'artifact-manifest.json'),
          ];
          const reports = [
            path.join(root, 'report.json'),
            path.join(root, 'journey', 'journey-report.json'),
          ];
          // Yasak verdict etiketleri: PASS yerine geçemez (skip ≠ PASS).
          const forbiddenVerdictTokens = ['SKIP', 'SKIPPED', 'NEUTRAL', 'CANCELLED', 'PENDING', 'UNKNOWN'];

          const problems = [];
          if (!/^[0-9a-f]{40}$/i.test(headSha)) {
            problems.push(`PULL_REQUEST_HEAD_SHA is not an exact commit SHA: '${headSha}'`);
          }

          for (const manifestPath of manifests) {
            if (!fs.existsSync(manifestPath)) {
              problems.push(`missing manifest: ${manifestPath}`);
              continue;
            }
            const manifest = JSON.parse(fs.readFileSync(manifestPath, 'utf8'));
            if (manifest.headSha !== headSha) {
              problems.push(`${manifestPath}: headSha '${manifest.headSha}' != '${headSha}'`);
            }
            const findings = manifest.redaction?.findingCount;
            if (findings !== 0) {
              problems.push(`${manifestPath}: redaction findingCount=${findings}`);
            }
            const files = manifest.coverage?.files ?? [];
            if (files.length === 0) problems.push(`${manifestPath}: no covered artifact`);
            const manifestDir = path.dirname(manifestPath);
            for (const relative of files) {
              if (!fs.existsSync(path.join(manifestDir, relative))) {
                problems.push(`${manifestPath}: covered artifact missing on disk: ${relative}`);
              }
            }
            console.log(`manifest ok: ${manifestPath} (head=${manifest.headSha}, files=${files.length}, findings=${findings})`);
          }

          for (const reportPath of reports) {
            if (!fs.existsSync(reportPath)) {
              problems.push(`missing report: ${reportPath}`);
              continue;
            }
            const report = fs.readFileSync(reportPath, 'utf8');
            const upper = report.toUpperCase();
            for (const token of forbiddenVerdictTokens) {
              if (new RegExp(`"${token}"`).test(upper)) {
                problems.push(`${reportPath}: forbidden verdict token '${token}' is not acceptance evidence`);
              }
            }
            console.log(`report ok: ${reportPath}`);
          }

          if (problems.length > 0) {
            console.error(`Artifact head-SHA binding check failed (${problems.length}):`);
            for (const problem of problems) console.error(` - ${problem}`);
            process.exit(1);
          }
          console.log('Acceptance artifacts are bound to the exact head SHA with zero redaction findings.');
          NODE
