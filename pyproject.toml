[project]
name = "okulsaas-hco"
version = "0.2.0"
description = "Hermes-native HCO control-plane (proves issue #260)"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.5"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests/hco"]
addopts = "-q"
