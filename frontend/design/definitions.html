<!doctype html>
<html lang="tr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="data:," />
    <title>Tanımlar — Okul Yönetim SaaS</title>
    <link rel="stylesheet" href="../app/tokens.css" />
  </head>
  <body>
    <a class="skip-link" href="#design-main">İçeriğe geç</a>
    <header class="topbar">
      <div>
        <p class="eyebrow">Tanımlar</p>
        <h1>Kaynak listeleri</h1>
        <p class="topbar-subtitle">Öğretmen, grup, öğrenci; ders, derslik, saat dilimi. Liste, arama ve detay sekmeleri.</p>
      </div>
    </header>
    <nav class="tabs" aria-label="Tasarım akışları">
      <button class="tab" data-tab="bugun" aria-selected="true"><strong>Bugün</strong></button>
      <button class="tab" data-tab="program" aria-selected="false"><strong>Program</strong></button>
      <button class="tab" data-tab="izinler" aria-selected="false"><strong>İzinler</strong></button>
      <button class="tab" data-tab="yoklama" aria-selected="false"><strong>Yoklama</strong></button>
      <button class="tab" data-tab="veli-bilgilendirme" aria-selected="false"><strong>Veli Bilgilendirme</strong></button>
      <button class="tab" data-tab="tanımlar" aria-selected="false"><strong>Tanımlar</strong></button>
      <button class="tab" data-tab="raporlar" aria-selected="false"><strong>Raporlar</strong></button>
      <button class="tab" data-tab="yönetim" aria-selected="false"><strong>Yönetim</strong></button>
    </nav>
    <main id="design-main" tabindex="-1" data-state="empty">
      <section class="panel definitions-panel" aria-labelledby="definitions-heading">
        <div>
          <h2 id="definitions-heading">Kaynak tanımları</h2>
          <form class="filter-grid" aria-label="Tanım arama">
            <label>
              Kaynak türü
              <select id="definition-type" name="type">
                <option value="">Tüm kaynaklar</option>
                <option value="teachers">Öğretmen</option>
                <option value="groups">Grup</option>
                <option value="students">Öğrenci</option>
                <option value="courses">Ders</option>
                <option value="rooms">Derslik</option>
                <option value="time-slots">Saat dilimi</option>
              </select>
            </label>
            <label>
              Arama
              <input id="definition-search" name="q" placeholder="İsimle ara" />
            </label>
          </form>
          <div id="definition-list" class="cards" role="region" aria-label="Tanım listesi">
            <section class="empty-state" aria-labelledby="empty-definitions-heading">
              <div>
                <h3 id="empty-definitions-heading">Kayıt yok</h3>
                <p class="hint">Bir kaynak türü seçin veya arama yapın.</p>
              </div>
            </section>
          </div>
        </div>
      </section>
    </main>
    <footer class="shell-footer">
      <p>Okul Yönetim SaaS: KVKK uyumlu çalışma ortamı</p>
    </footer>
  </body>
</html>
