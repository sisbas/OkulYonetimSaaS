<!doctype html>
<html lang="tr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="data:," />
    <title>İzinler — Okul Yönetim SaaS</title>
    <link rel="stylesheet" href="../app/tokens.css" />
  </head>
  <body>
    <a class="skip-link" href="#design-main">İçeriğe geç</a>
    <header class="topbar">
      <div>
        <p class="eyebrow">İzinler</p>
        <h1>İzin talepleri</h1>
        <p class="topbar-subtitle">Durum filtresiyle kuyruğu tarayın: draft, pending, approved, rejected.</p>
      </div>
    </header>
    <nav class="tabs" aria-label="Tasarım akışları">
      <button class="tab" data-tab="bugun" aria-selected="true"><strong>Bugün</strong></button>
      <button class="tab" data-tab="program" aria-selected="false"><strong>Program</strong></button>
      <button class="tab" data-tab="izinler" aria-selected="false"><strong>İzinler</strong></button>
      <button class="tab" data-tab="yoklama" aria-selected="false"><strong>Yoklama</strong></button>
      <button class="tab" data-tab="veli-bilgilendirme" aria-selected="false"><strong>Veli Bilgilendirme</strong></button>
      <button class="tab" data-tab="tanımlar" aria-selected="false"><strong>Tanımlar</strong></button>
      <button class="tab" data-tab="raporlar" aria-selected="false"><strong>Raporlar</strong></button>
      <button class="tab" data-tab="yönetim" aria-selected="false"><strong>Yönetim</strong></button>
    </nav>
    <main id="design-main" tabindex="-1" data-state="empty">
      <section class="panel leave-list-panel" aria-labelledby="leave-heading">
        <div>
          <h2 id="leave-heading">İzin talebi listesi</h2>
          <form class="filter-grid" aria-label="İzin durum filtreleri">
            <label>
              Durum
              <select id="leave-status-filter" name="status">
                <option value="">Tüm durumlar</option>
                <option value="draft">Taslak</option>
                <option value="pending">Beklemede</option>
                <option value="approved">Onaylandı</option>
                <option value="rejected">Reddedildi</option>
              </select>
            </label>
          </form>
          <div id="leave-cards" class="cards" role="region" aria-label="İzin kartları">
            <section class="empty-state" aria-labelledby="empty-leaves-heading">
              <div>
                <h3 id="empty-leaves-heading">Gösterilecek izin talebi yok</h3>
                <p class="hint">Bir durum filtresi seçin veya yeni bir talep açın.</p>
              </div>
            </section>
          </div>
        </div>
      </section>
    </main>
    <footer class="shell-footer">
      <p>Okul Yönetim SaaS: KVKK uyumlu çalışma ortamı</p>
    </footer>
  </body>
</html>
